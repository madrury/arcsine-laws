[project]
name = "arcsine-laws"
version = "0.1.0"
description = "Simulations and plots for a talk on the arcsine laws."
readme = "README.md"
authors = [
    { name = "Matthew Drury", email = "matthew.drury.83@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]

# Formatting is done by hand (see ~/.claude/CLAUDE.md); don't run `ruff format`,
# it would undo the operator spacing conventions. Lint whitespace only where it
# agrees with them.
[tool.ruff.lint]
preview = true
extend-select = ["E2", "W"]
ignore = [
    "E226",  # Arithmetic spacing shows precedence: 2*x + 1.
    "E265",  # Section banners: #----------
]
